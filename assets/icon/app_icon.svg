<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="proBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#141E30"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="proGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF9F1C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#proBg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFD700" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Minimalist Hexagon Shield + Check Mark Emblem -->
  <g filter="url(#proGlow)">
    <path d="M 256 110 L 380 180 V 320 L 256 390 L 132 320 V 180 Z" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195 255 L 240 300 L 345 175" fill="none" stroke="url(#checkGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
